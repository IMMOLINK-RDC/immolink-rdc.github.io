<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma Caisse</title>
<meta name="theme-color" content="#0B3C7A">
<meta name="description" content="Caisse, stock, dépenses et dettes pour ton commerce. Fonctionne sans connexion.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ma Caisse">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF3F7;--surface:#FFFFFF;--ink:#13243A;--muted:#5B6B7F;--line:#D9E2EA;
  --blue:#0B4F9C;--blue-ink:#FFFFFF;--sun:#F7B500;--sun-ink:#2A1F00;
  --red:#C0182F;--green:#0E7A4F;--tint:#E3EDF8;--head:#0B3C7A;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1722;--surface:#16222F;--ink:#EAF1F8;--muted:#9BAABB;--line:#26364A;
    --blue:#5AA2F0;--blue-ink:#071423;--sun:#F7B500;--sun-ink:#2A1F00;
    --red:#FF6B7C;--green:#4CCB94;--tint:#1B2D44;--head:#0A2A52;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1722;--surface:#16222F;--ink:#EAF1F8;--muted:#9BAABB;--line:#26364A;
  --blue:#5AA2F0;--blue-ink:#071423;--sun:#F7B500;--sun-ink:#2A1F00;
  --red:#FF6B7C;--green:#4CCB94;--tint:#1B2D44;--head:#0A2A52;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 'Source Sans 3',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:150px;-webkit-tap-highlight-color:transparent}
body.lock{overflow:hidden}
h1,h2,strong,.tn,.tp{font-family:'Bricolage Grotesque','Source Sans 3',system-ui,sans-serif}
h2{font-size:1.45rem;margin:0;font-weight:800}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
small{color:var(--muted);font-size:.85rem;display:block}
.muted{color:var(--muted);font-size:.92rem}
.pad{padding:18px 4px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--head);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px}
.top h1{margin:0;font-size:1.35rem;font-weight:800;line-height:1.1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:60vw}
.rate{background:none;border:0;color:#BFD6F2;padding:2px 0;font-size:.88rem;text-align:left}
.curbtn{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.3);color:#fff;border-radius:10px;padding:8px 12px;font-weight:600;font-size:.9rem;white-space:nowrap}

main{padding:14px 14px 0;max-width:720px;margin:0 auto}
.row.head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.search{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface);color:var(--ink);padding:0 14px;font:inherit;margin-bottom:12px}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:96px;display:flex;flex-direction:column;gap:2px}
.tile .tn{font-weight:600;font-size:1.02rem;line-height:1.2}
.tile .tp{font-weight:800;font-size:1.08rem;margin-top:auto;font-variant-numeric:tabular-nums}
.tile .ts{font-size:.82rem;color:var(--muted)}
.tile .ts.low,.qtyv.low{color:var(--red);font-weight:700}
.tile.in{border:2px solid var(--blue);padding:11px}
.tile.out{opacity:.5}
.badge{position:absolute;top:-8px;right:-6px;min-width:28px;height:28px;border-radius:14px;background:var(--blue);color:var(--blue-ink);font-weight:800;display:grid;place-items:center;padding:0 7px;font-size:.95rem}

.empty{padding:34px 8px;text-align:left}
.empty h2{margin-bottom:8px}
.empty p{color:var(--muted);margin:0 0 18px}
.empty .btn{margin-bottom:10px}

.btn{display:block;width:100%;min-height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;padding:0 18px;margin-top:10px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
.btn.sun{background:var(--sun);border-color:var(--sun);color:var(--sun-ink)}
.btn.big{min-height:58px;font-size:1.12rem;font-family:'Bricolage Grotesque',sans-serif}
.btn.ghost{background:transparent}
.btn.danger{background:transparent;color:var(--red);border-color:var(--red)}
.btn.sm{width:auto;min-height:42px;margin:0;padding:0 14px;font-size:.95rem}

#bar{position:fixed;left:10px;right:10px;bottom:calc(66px + env(safe-area-inset-bottom,0px));z-index:6;max-width:700px;margin:0 auto;background:var(--sun);color:var(--sun-ink);border:0;border-radius:14px;min-height:62px;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:left}
#bar .bc{font-weight:700}
#bar .bt{margin-left:auto;text-align:right}
#bar .bt strong{font-size:1.25rem;display:block;line-height:1.1}
#bar .bt small{color:var(--sun-ink);opacity:.75}
#bar .bgo{background:var(--sun-ink);color:var(--sun);border-radius:10px;padding:8px 14px;font-weight:700}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
.nav button{flex:1;background:none;border:0;border-top:3px solid transparent;padding:8px 2px 8px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:.78rem;font-weight:600;min-height:62px}
.nav button.on{color:var(--blue);border-top-color:var(--blue)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

#ov{position:fixed;inset:0;z-index:20;background:rgba(8,16,26,.55);display:flex;align-items:flex-end;justify-content:center}
#sheet{background:var(--surface);width:100%;max-width:720px;max-height:90%;overflow-y:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.shead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.shead button{background:none;border:0;color:var(--muted);font-weight:600;padding:8px 0 8px 12px}

.lines{list-style:none;margin:0;padding:0}
.lines li{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.ln b{display:block}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:700}
.qty span{min-width:28px;text-align:center;font-weight:700;font-size:1.1rem}
.total{display:flex;justify-content:space-between;align-items:flex-end;padding:14px 0 6px}
.total span{font-weight:600;color:var(--muted)}
.total div{text-align:right}
.total strong{font-size:1.8rem;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.lab{font-weight:700;margin:12px 0 6px;font-size:.95rem}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;min-height:44px;padding:0 16px;font-weight:600}
.chip.on{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}

label{display:block;font-weight:600;font-size:.95rem;margin-top:12px}
input,select,textarea{display:block;width:100%;min-height:48px;margin-top:4px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);padding:0 12px;font:inherit;font-weight:400}
textarea{padding:10px 12px;font-size:.8rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--red);font-weight:600;min-height:1.2em;margin:8px 0 0}

.alert{background:var(--tint);border-left:4px solid var(--red);padding:10px 12px;border-radius:8px;margin:0 0 12px;font-weight:600}
.stock,.sales,.methods{list-style:none;margin:0;padding:0}
.stock li button,.sales li button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:8px;min-height:62px}
.stock .rt,.sales .r{text-align:right;flex:none}
.qtyv{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;font-size:1.3rem;display:block;line-height:1.1}
.sales small{max-width:56vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.sum{display:flex;justify-content:space-between;align-items:flex-end;background:var(--head);color:#fff;border-radius:14px;padding:16px;margin:10px 0}
.sum strong{font-size:1.9rem;line-height:1.1;display:block;font-variant-numeric:tabular-nums}
.sum small{color:#BFD6F2}
.sum .lab{color:#BFD6F2;font-weight:600;margin:0 0 2px}
.sum .cnt{text-align:right}
.sum .cnt strong{font-size:1.6rem}
.methods li{display:flex;justify-content:space-between;padding:8px 2px;border-bottom:1px solid var(--line)}
.methods{margin-bottom:14px}
.profit{margin:0 0 12px}
.profit b{color:var(--green)}

details.bk{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--surface)}
details.bk summary{font-weight:700;cursor:pointer}

#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:30;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.seg{display:flex;gap:8px;margin-bottom:12px}
.seg .chip{flex:1;padding:0 8px}
.mline{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:10px}
.mline select{margin-top:0}
.mline label{margin-top:8px}
.mline .r2{display:grid;grid-template-columns:1fr 1.4fr auto;gap:8px;align-items:end}
.mline .x{height:48px;width:48px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--red);font-size:1.3rem;font-weight:700}
.chart{width:100%;height:auto;display:block;background:var(--surface);border:1px solid var(--line);border-radius:12px;touch-action:manipulation}
.chart text{fill:var(--muted);font-size:10px;font-family:'Source Sans 3',system-ui,sans-serif}
.chart .grid0{stroke:var(--line);stroke-dasharray:3 3}
.chart .ln{fill:none;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.s-v{stroke:var(--blue)}.chart .ln.s-p{stroke:var(--green)}.chart .ln.s-d{stroke:var(--red)}.chart .ln.s-n{stroke:var(--green)}
.chart .dt.s-v{fill:var(--blue)}.chart .dt.s-p{fill:var(--green)}.chart .dt.s-d{fill:var(--red)}.chart .dt.s-n{fill:var(--green)}
.chart .cm{stroke:var(--ink);stroke-width:1;opacity:.5}
.chip.lg{background:var(--surface);opacity:.55}
.chip.lg.on{background:var(--tint);color:var(--ink);border-color:var(--ink);opacity:1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px}
.d-v{background:var(--blue)}.d-p{background:var(--green)}.d-d{background:var(--red)}.d-n{background:var(--green)}
.pl{list-style:none;margin:0;padding:0}
.pr{padding:10px 0;border-bottom:1px solid var(--line)}
.pr .pn{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.pr .pn span{font-family:'Bricolage Grotesque',sans-serif;font-weight:800;white-space:nowrap}
.tag{font-size:.78rem;font-weight:700;border-radius:6px;padding:1px 7px;margin-left:6px;border:1px solid currentColor;white-space:nowrap}
.t-top{color:var(--green)}.t-mid{color:var(--blue)}.t-low{color:var(--muted)}.t-zero{color:var(--red)}
.bar{height:8px;border-radius:4px;background:var(--line);margin:6px 0 3px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:4px}
.b-top i{background:var(--green)}.b-mid i{background:var(--blue)}.b-low i{background:var(--sun)}
.up{color:var(--green)}.down{color:var(--red)}
.methods li.net{font-weight:700;font-size:1.05rem;border-bottom:2px solid var(--ink)}
.gt{display:grid;grid-template-columns:.9fr 1.4fr 1.2fr;gap:10px;background:var(--head);color:#fff;border-radius:14px;padding:14px;margin-top:14px}
.gt span{display:block;color:#BFD6F2;font-size:.8rem;line-height:1.2;margin-bottom:2px}
.gt strong{font-size:1.1rem;line-height:1.15;display:block;font-variant-numeric:tabular-nums}
@media (min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.cloudbox{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--tint)}
.cloudbox .btn{margin-top:10px}
.cloudbox p{margin:6px 0}
.bkfile{margin-top:18px}
.instbox{margin-top:18px;border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--tint)}
.instbox p{margin:0 0 10px}
</style>
</head>
<body>
<header class="top">
  <div>
    <h1 id="shop">Mon commerce</h1>
    <button class="rate" id="ratechip" data-act="goset"></button>
  </div>
  <button class="curbtn" id="curbtn" data-act="cur"></button>
</header>

<main id="view"></main>

<button id="bar" data-act="cart" hidden></button>

<nav class="nav" aria-label="Navigation principale">
  <button data-tab="caisse"><svg viewBox="0 0 24 24"><path d="M3 7h18l-2 12H5L3 7z"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg>Caisse</button>
  <button data-tab="stock"><svg viewBox="0 0 24 24"><path d="M3 8l9-5 9 5v8l-9 5-9-5V8z"/><path d="M3 8l9 5 9-5M12 13v8"/></svg>Stock</button>
  <button data-tab="sales"><svg viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2V3z"/><path d="M9 8h6M9 12h6"/></svg>Ventes</button>
  <button data-tab="money"><svg viewBox="0 0 24 24"><path d="M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/><path d="M3 7l12-3v3M17 14h2"/></svg>Dépenses</button>
  <button data-tab="set"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h2M10 17h10"/><circle cx="16" cy="7" r="2"/><circle cx="8" cy="17" r="2"/></svg>Réglages</button>
</nav>

<div id="ov" hidden><div id="sheet" role="dialog" aria-modal="true"><div class="shead"><span></span><button data-act="close">Fermer</button></div><div id="sheetbody"></div></div></div>
<input type="file" id="bkfile" accept="application/json,.json" hidden>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';
var KEY='ma-caisse-v1';
var DEF={shop:'Mon commerce',rate:2800,cur:'USD',products:[],sales:[],expenses:[],debts:[]};
var METHODS=['Espèces','M-Pesa','Orange Money','Airtel Money'];
var S=load();
var cart={},tab='caisse',q='',period='today',sheetKind='',payM='Espèces',warned=false,tt;

function norm(o){
  var r=Object.assign(JSON.parse(JSON.stringify(DEF)),o||{});
  ['products','sales','expenses','debts'].forEach(function(k){if(!Array.isArray(r[k]))r[k]=[];});
  return r;
}
function load(){
  try{
    var r=localStorage.getItem(KEY);
    if(r){return norm(JSON.parse(r));}
  }catch(e){}
  return JSON.parse(JSON.stringify(DEF));
}
function save(ns){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){if(!warned){warned=true;toast('Impossible d’enregistrer sur ce téléphone');}}
  if(!ns)scheduleCloud();
}
function $(s){return document.querySelector(s);}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function num(v){var n=parseFloat(String(v).replace(/\s/g,'').replace(',','.'));return isFinite(n)?n:0;}
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(function(){t.classList.remove('on');},2400);}

/* Montants */
function usd(n){return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2})+' $';}
function cdf(n){return Math.round(n).toLocaleString('fr-FR')+' FC';}
function own(p){return p.cur==='USD'?usd(p.price):cdf(p.price);}
function pUSD(p){return p.cur==='USD'?p.price:p.price/S.rate;}
function pCostUSD(p){return (p.cost||0)/(p.cur==='USD'?1:S.rate);}
function showU(u,rate){return S.cur==='USD'?usd(u):cdf(u*(rate||S.rate));}
function otherU(u,rate){return S.cur==='USD'?cdf(u*(rate||S.rate)):usd(u);}
function hm(t){return new Date(t).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});}
function when(t){
  var d=new Date(t);
  if(d.toDateString()===new Date().toDateString())return 'aujourd’hui '+hm(t);
  return d.toLocaleDateString('fr-FR',{day:'numeric',month:'short'})+' '+hm(t);
}

/* Panier */
function pById(id){return S.products.find(function(p){return p.id===id;});}
function cartItems(){
  return Object.keys(cart).map(function(id){return {p:pById(id),q:cart[id]};}).filter(function(x){return x.p&&x.q>0;});
}
function cartTotal(){return cartItems().reduce(function(t,x){return t+pUSD(x.p)*x.q;},0);}
function cartCount(){return cartItems().reduce(function(t,x){return t+x.q;},0);}
function add(id,d){
  var p=pById(id);if(!p)return;
  var n=(cart[id]||0)+d;
  if(n>p.stock){toast('Stock insuffisant : il reste '+p.stock);return;}
  if(n<=0)delete cart[id];else cart[id]=n;
  updateCaisse();
  if(sheetKind==='cart')openCart();
}

/* Feuille (bottom sheet) */
function openSheet(kind,html){sheetKind=kind;$('#sheetbody').innerHTML=html;$('#ov').hidden=false;document.body.classList.add('lock');}
function closeSheet(){sheetKind='';$('#ov').hidden=true;document.body.classList.remove('lock');}

/* En-tête */
function updateHeader(){
  $('#shop').textContent=S.shop||'Mon commerce';
  $('#ratechip').textContent='1 $ = '+Math.round(S.rate).toLocaleString('fr-FR')+' FC';
  $('#curbtn').textContent='Totaux en '+(S.cur==='USD'?'$':'FC');
}

/* Caisse */
function viewCaisse(){
  var v=$('#view');
  if(!S.products.length){
    v.innerHTML='<div class="empty"><h2>Ajoute ton premier produit</h2><p>Tes produits apparaissent ici. Touche un produit pour l’ajouter à la vente.</p><button class="btn primary" data-act="newp">Ajouter un produit</button><button class="btn ghost" data-act="demo">Essayer avec des exemples</button></div>';
    return;
  }
  v.innerHTML='<input id="q" class="search" type="search" placeholder="Chercher un produit" aria-label="Chercher un produit"><div id="grid" class="grid"></div>';
  $('#q').value=q;
  $('#q').addEventListener('input',function(e){q=e.target.value;fillGrid();});
  fillGrid();
}
function fillGrid(){
  var g=$('#grid');if(!g)return;
  var t=q.trim().toLowerCase();
  var list=S.products.filter(function(p){return !t||(p.name+' '+(p.cat||'')).toLowerCase().indexOf(t)>-1;})
    .sort(function(a,b){return a.name.localeCompare(b.name,'fr');});
  if(!list.length){g.innerHTML='<p class="muted pad">Aucun produit ne correspond.</p>';return;}
  g.innerHTML=list.map(function(p){
    var n=cart[p.id]||0,out=p.stock<=0;
    return '<button class="tile'+(out?' out':'')+(n?' in':'')+'" data-act="add" data-id="'+p.id+'"'+(out?' disabled':'')+'>'+
      '<span class="tn">'+esc(p.name)+'</span>'+
      '<span class="tp">'+own(p)+'</span>'+
      '<span class="ts'+(p.stock<=p.alert?' low':'')+'">'+(out?'Épuisé':'Reste '+p.stock)+'</span>'+
      (n?'<span class="badge">'+n+'</span>':'')+'</button>';
  }).join('');
}
function updateCaisse(){if(tab==='caisse'&&S.products.length)fillGrid();updateBar();}
function updateBar(){

function checkout(){
  var items=cartItems();if(!items.length)return;
  for(var i=0;i<items.length;i++){
    if(items[i].q>items[i].p.stock){toast('Stock insuffisant pour '+items[i].p.name);return;}
  }
  var sale={id:uid(),t:Date.now(),rate:S.rate,method:payM,total:cartTotal(),
    lines:items.map(function(x){return {id:x.p.id,name:x.p.name,q:x.q,u:pUSD(x.p),c:pCostUSD(x.p)};})};
  items.forEach(function(x){x.p.stock-=x.q;});
  S.sales.unshift(sale);cart={};save();closeSheet();updateCaisse();
  toast('Vente enregistrée : '+showU(sale.total));

/* Ventes */
function inPeriod(s){
  if(period==='all')return true;
  if(period==='week')return s.t>=Date.now()-7*864e5;
  return new Date(s.t).toDateString()===new Date().toDateString();
}
function profit(s){return s.total-s.lines.reduce(function(t,l){return t+(l.c||0)*l.q;},0);}

  if(vsub==='evo'){viewEvo();return;}
  var list=S.sales.filter(inPeriod);

function fmtDate(iso){try{return new Date(iso).toLocaleString('fr-FR',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'});}catch(e){return '';}}
function sbErr(j,st){
  var c=(j&&(j.error_code||j.code))||'',m=(j&&(j.msg||j.message||j.error_description||j.error))||'';
  if(c==='invalid_credentials'||/invalid login/i.test(m))return 'E-mail ou mot de passe incorrect';
  if(c==='user_already_exists'||/already registered/i.test(m))return 'Un compte existe déjà avec cet e-mail';
  if(c==='weak_password'||/password should/i.test(m))return 'Mot de passe trop faible (6 caractères minimum)';
  if(c==='email_address_invalid'||/email.*invalid|invalid.*email/i.test(m))return 'Adresse e-mail non valide';
  if(c==='email_not_confirmed')return 'Confirme ton adresse e-mail avant de te connecter';
  if(c==='over_request_rate_limit'||c==='over_email_send_rate_limit'||st===429)return 'Trop de tentatives, réessaie dans quelques minutes';
  if(c==='signup_disabled')return 'Les inscriptions sont fermées pour le moment';
  return 'Une erreur est survenue ('+(c||st)+')';
}
function netErr(e){return e&&e.status?e.message:'Pas de connexion internet';}
function sbFetch(path,o){
  o=o||{};
  var h={'apikey':SB_KEY,'Content-Type':'application/json'};
  if(o.token)h['Authorization']='Bearer '+o.token;
  if(o.prefer)h['Prefer']=o.prefer;
  return fetch(SB_URL+path,{method:o.method||'GET',headers:h,body:o.body?JSON.stringify(o.body):undefined}).then(function(r){
    return r.text().then(function(t){
      var j=null;try{j=t?JSON.parse(t):null;}catch(e){}
      if(!r.ok){var er=new Error(sbErr(j,r.status));er.status=r.status;er.code=j&&(j.code||j.error_code);throw er;}
      return j;
    });
  });
}
function setSession(j){
  A={token:j.access_token,refresh:j.refresh_token,exp:j.expires_at||Math.floor(Date.now()/1000)+(j.expires_in||3600),
     uid:j.user?j.user.id:(A&&A.uid),email:j.user?j.user.email:(A&&A.email)};
  saveAuth();
}
function ensureToken(){
  if(!A)return Promise.reject(new Error('Non connecté'));
  if(A.exp-60>Date.now()/1000)return Promise.resolve(A.token);
  return sbFetch('/auth/v1/token?grant_type=refresh_token',{method:'POST',body:{refresh_token:A.refresh}}).then(function(j){
    setSession(j);return A.token;
  }).catch(function(e){
    if(e.status===400||e.status===401){A=null;saveAuth();CL={last:null,uid:null,dirty:false};saveCl();SUB=null;render();toast('Session expirée : reconnecte-toi');}
    throw e;
  });
}
function sbData(path,o){o=o||{};return ensureToken().then(function(tk){o.token=tk;return sbFetch(path,o);});}

function authSubmit(mode){
  if(authBusy)return;
  var em=($('#a_email').value||'').trim().toLowerCase(),pw=$('#a_pass').value||'';
  if(!/^\S+@\S+\.\S+$/.test(em)){authMsg('Écris une adresse e-mail valide');return;}
  if(pw.length<6){authMsg('Le mot de passe doit avoir au moins 6 caractères');return;}
  authBusy=true;authMsg('Un instant…');
  var req=mode==='signup'
    ?sbFetch('/auth/v1/signup',{method:'POST',body:{email:em,password:pw}})
    :sbFetch('/auth/v1/token?grant_type=password',{method:'POST',body:{email:em,password:pw}});
  req.then(function(j){
    authBusy=false;
    if(!j||!j.access_token){authMsg('Compte créé. Vérifie ta boîte e-mail pour le confirmer, puis connecte-toi.');return;}
    if(CL.uid&&j.user&&CL.uid!==j.user.id){CL={last:null,uid:null,dirty:false};saveCl();}
    setSession(j);subAt=0;
    toast(mode==='signup'?'Compte créé':'Connecté');
    render();
    return afterLogin();
  }).catch(function(e){authBusy=false;authMsg(netErr(e));});
}
function afterLogin(){
  return Promise.all([
    sbData('/rest/v1/subscriptions?select=plan,expires_at'),
    sbData('/rest/v1/backups?select=updated_at')
  ]).then(function(r){
    SUB=r[0]&&r[0][0]||null;subAt=Date.now();
    var rb=r[1]&&r[1][0]||null;
    var e=$('#cl_sub');if(e)e.textContent=subText();
    if(!rb)return pushCloud(false,true);
    if(confirm('Une sauvegarde en ligne existe déjà (du '+fmtDate(rb.updated_at)+'). La charger et remplacer les données de ce téléphone ?')){
      return pullCloud(true);
    }
    CL.last=null;CL.uid=A.uid;saveCl();
    toast('Données de ce téléphone conservées');
  }).catch(function(e){cloudFail(e,false);});
}
function pushCloud(silent,force){
  if(!A||cloudBusy)return Promise.resolve();
  cloudBusy=true;clStatus('Sauvegarde en cours…');
  var v=cloudVer;
  return sbData('/rest/v1/backups?select=updated_at').then(function(rows){
    var remote=rows&&rows[0]?rows[0].updated_at:null;
    if(remote&&remote!==CL.last&&!force){
      if(silent){var c=new Error('conflit');c.kind='conflict';throw c;}
      if(!confirm('Une sauvegarde en ligne existe déjà (du '+fmtDate(remote)+') et elle ne vient pas de ce téléphone, ou elle est plus récente. La remplacer par les données de ce téléphone ?')){var x=new Error('annulé');x.kind='cancel';throw x;}
    }
    return sbData('/rest/v1/backups?on_conflict=user_id&select=updated_at',{method:'POST',prefer:'resolution=merge-duplicates,return=representation',body:{user_id:A.uid,data:S}});
  }).then(function(rows){
    cloudBusy=false;
    CL.last=rows&&rows[0]?rows[0].updated_at:CL.last;CL.uid=A.uid;CL.dirty=(cloudVer!==v);saveCl();
    clStatus();
    if(!silent)toast('Sauvegarde en ligne terminée');
    if(CL.dirty)scheduleCloud();
  }).catch(function(e){cloudFail(e,silent);});
}
function pullCloud(skip){
  return sbData('/rest/v1/backups?select=data,updated_at').then(function(rows){
    if(!rows||!rows[0]){toast('Aucune sauvegarde en ligne pour ce compte');return;}
    if(!skip&&!confirm('Remplacer les données de ce téléphone par la sauvegarde en ligne du '+fmtDate(rows[0].updated_at)+' ?'))return;
    S=norm(rows[0].data);cart={};save(true);
    CL.last=rows[0].updated_at;CL.uid=A.uid;CL.dirty=false;saveCl();
    render();toast('Sauvegarde en ligne chargée');
  }).catch(function(e){cloudFail(e,false);});
}
function cloudFail(e,silent){
  cloudBusy=false;
  if(e&&e.kind==='cancel'){clStatus();return;}
  if(e&&e.kind==='conflict'){
    clStatus('Une version différente existe en ligne : ouvre Réglages et choisis « Sauvegarder maintenant » ou « Restaurer ».');
    if(!warnedCl){warnedCl=true;toast('Version en ligne différente : voir Réglages');}
    return;
  }
  var m;
  if(e&&(e.status===403||e.code==='42501'))m='Ton essai ou abonnement est terminé : la sauvegarde en ligne est suspendue.';
  else m=netErr(e);
  clStatus(m);
  if(!silent)toast(m);
}
function scheduleCloud(){
  if(!A||!CL.last)return;
  cloudVer++;CL.dirty=true;saveCl();
  clearTimeout(cloudTimer);
  cloudTimer=setTimeout(function(){pushCloud(true,false);},6000);
}
function doLogout(){

function markBk(){try{localStorage.setItem(KEY+'-lastbk',String(Date.now()));}catch(e){}var l=$('#lastbk');if(l)l.textContent=lastBkText();}
function lastBkText(){
  var t=0;try{t=parseInt(localStorage.getItem(KEY+'-lastbk'),10)||0;}catch(e){}
  if(!t)return 'Aucune sauvegarde faite pour l’instant. Pense à en faire une régulièrement.';
  var d=Math.floor((Date.now()-t)/864e5);
  return 'Dernière sauvegarde : '+(d<=0?'aujourd’hui':'il y a '+d+' jour'+(d>1?'s':''))+(d>=7?'. Pense à en refaire une.':'.');
}
function doBackup(){
  var json=JSON.stringify(S),name='ma-caisse-'+todayStr()+'.json',file=null;
  try{file=new File([json],name,{type:'application/json'});}catch(e){}
  if(file&&navigator.canShare&&navigator.canShare({files:[file]})){
    navigator.share({files:[file],title:'Sauvegarde Ma Caisse'}).then(function(){markBk();toast('Sauvegarde envoyée');}).catch(function(){});
    return;
  }
  var a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},1000);
  markBk();toast('Fichier enregistré dans les téléchargements');
}
function importFile(f){
  if(!f)return;
  var r=new FileReader();
  r.onload=function(){
    try{
      var o=JSON.parse(r.result);
      if(!o||!Array.isArray(o.products)||!Array.isArray(o.sales))throw new Error('format');
      if(!confirm('Remplacer les données actuelles par cette sauvegarde ?'))return;
      S=norm(o);cart={};save();render();toast('Données restaurées');
    }catch(err){toast('Ce fichier n’est pas une sauvegarde valide');}
  };
  r.onerror=function(){toast('Impossible de lire ce fichier');};
  r.readAsText(f);
}

    }).join('')+'</div>'+

    '<div class="total"><span>Total</span><div><strong id="m_tot"></strong><small id="m_tot2"></small></div></div>'+
    '<p class="err" id="m_err" role="alert"></p>'+
    '<button class="btn sun big" data-act="m_save">Enregistrer la vente</button>');
  updMTot();
}
function onMInput(e){
  var t=e.target;
  if(!t||!t.dataset||!t.dataset.ml||sheetKind!=='msale')return;
  var k=t.dataset.ml,i=+t.dataset.i;
  if(k==='sel'){
    var l=M.lines[i];if(!l||l.id===t.value)return;
    l.id=t.value;var p=pById(t.value);l.price=p?String(p.price):'';drawMSale();return;
  }
  if(k==='q'&&M.lines[i])M.lines[i].q=t.value;
  else if(k==='price'&&M.lines[i])M.lines[i].price=t.value;
  else if(k==='date')M.date=t.value;
  else if(k==='client')M.client=t.value;
  updMTot();
}
function saveMSale(){
  function err(m){$('#m_err').textContent=m;}
  var rows=[];
  for(var i=0;i<M.lines.length;i++){
    var l=M.lines[i];
    if(!l.id){err('Choisis un produit pour chaque ligne.');return;}
    var p=pById(l.id),q=Math.floor(num(l.q)),pr=num(l.price);
    if(q<=0){err('Indique une quantité pour '+p.name+'.');return;}
    if(pr<=0){err('Indique le prix de '+p.name+'.');return;}
    rows.push({p:p,q:q,pr:pr});
  }
  var need={};
  rows.forEach(function(x){need[x.p.id]=(need[x.p.id]||0)+x.q;});
  for(var k in need){
    var pp=pById(k);
    if(need[k]>pp.stock){err('Stock insuffisant pour '+pp.name+' : il reste '+pp.stock+'.');return;}
  }
  var client=M.client.trim();
  if(M.pay===CREDIT&&!client){err('Écris le nom du client pour une vente à crédit.');return;}
  var t=dateToT(M.date);
  var sale={id:uid(),t:t,rate:S.rate,method:M.pay,client:client,total:0,
    lines:rows.map(function(x){return {id:x.p.id,name:x.p.name,q:x.q,u:toUSDfrom(x.pr,x.p.cur),c:pCostUSD(x.p)};})};
  sale.total=sale.lines.reduce(function(a,l){return a+l.u*l.q;},0);
  rows.forEach(function(x){x.p.stock-=x.q;});
  S.sales.unshift(sale);
  S.sales.sort(function(a,b){return b.t-a.t;});
  if(M.pay===CREDIT){
    S.debts.push({id:uid(),kind:'client',who:client,total:sale.total,rate:S.rate,t:t,note:'Vente à crédit',saleId:sale.id,pays:[]});
  }
  save();closeSheet();render();
  toast(M.pay===CREDIT?'Vente à crédit enregistrée, dette ajoutée':'Vente enregistrée : '+showU(sale.total));
}

  var d=S.debts.find(function(x){return x.id===id;});if(!d)return;

  else{

    usd=Math.min(usd,rest);
  }
  d.pays.push({t:Date.now(),usd:usd});
  save();render();openDebt(id);toast('Paiement enregistré');
}

/* Évolution : courbes et performance des produits */
var vsub='list',erange='30',emetric='q',eser={v:true,d:true,n:true},CG={n:0};
function segV(){
  return '<div class="seg"><button class="chip'+(vsub==='list'?' on':'')+'" data-act="vsub" data-k="list">Historique</button>'+
    '<button class="chip'+(vsub==='evo'?' on':'')+'" data-act="vsub" data-k="evo">Évolution</button></div>';
}
function range(){
  var n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate(),st,len,ps;
  if(erange==='month'){st=new Date(y,m,1);len=d;ps=new Date(y,m-1,1);}
  else{len=erange==='7'?7:30;st=new Date(y,m,d-len+1);ps=new Date(y,m,d-2*len+1);}
  return {s:st.getTime(),len:len,ps:ps.getTime()};
}
function dlab(t){return new Date(t+432e5).toLocaleDateString('fr-FR',{day:'numeric',month:'short'});}
function daily(r){
  var a=[],i;
  for(i=0;i<r.len;i++)a.push({v:0,p:0,d:0,t:r.s+i*864e5});
  S.sales.forEach(function(x){var k=Math.floor((x.t-r.s)/864e5);if(k>=0&&k<r.len){a[k].v+=x.total;a[k].p+=profit(x);}});
  S.expenses.forEach(function(x){var k=Math.floor((x.t-r.s)/864e5);if(k>=0&&k<r.len)a[k].d+=x.usd;});
  a.forEach(function(d){d.n=d.p-d.d;});
  return a;
}
function trendTxt(v,pv){
  if(pv>0){var pc=Math.round((v-pv)/pv*100);return {t:(pc>=0?'+':'−')+Math.abs(pc)+' % par rapport à la période d’avant',c:pc>=0?'up':'down'};}
  return v>0?{t:'Nouveau sur cette période',c:'up'}:{t:'',c:''};
}
function lineChart(days){
  var W=340,H=176,L=10,R=10,T=18,B=24,n=days.length;
  var ks=['v','d','n'].filter(function(k){return eser[k];});
  if(!ks.length)return '<p class="muted pad">Active au moins une courbe.</p>';
  var mx=0,mn=0;
  days.forEach(function(d){ks.forEach(function(k){if(d[k]>mx)mx=d[k];if(d[k]<mn)mn=d[k];});});
  if(mx<=0&&mn>=0)return '<p class="muted pad">Rien à afficher pour les courbes choisies sur cette période.</p>';
  var span=(mx-mn)||1;
  function X(i){return n>1?L+i*(W-L-R)/(n-1):W/2;}
  function Y(v){return T+(H-T-B)*(1-(v-mn)/span);}
  CG={n:n,L:L,R:R,W:W,days:days};
  var g='<line class="grid0" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(0).toFixed(1)+'" y2="'+Y(0).toFixed(1)+'"/>';
  ks.forEach(function(k){
    var d=days.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p[k]).toFixed(1);}).join(' ');
    g+='<path class="ln s-'+k+'" d="'+d+'"/>';
    if(n<=14)days.forEach(function(p,i){g+='<circle class="dt s-'+k+'" cx="'+X(i).toFixed(1)+'" cy="'+Y(p[k]).toFixed(1)+'" r="3"/>';});
  });
  g+='<text x="'+L+'" y="11">'+esc(showU(mx))+'</text>';
  g+='<text x="'+L+'" y="'+(H-8)+'">'+dlab(days[0].t)+'</text>';
  if(n>2)g+='<text x="'+W/2+'" y="'+(H-8)+'" text-anchor="middle">'+dlab(days[Math.floor(n/2)].t)+'</text>';
  if(n>1)g+='<text x="'+(W-R)+'" y="'+(H-8)+'" text-anchor="end">'+dlab(days[n-1].t)+'</text>';
  g+='<line id="cm" class="cm" x1="0" x2="0" y1="'+T+'" y2="'+(H-B)+'" visibility="hidden"/>';
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" data-act="chartpt" role="img" aria-label="Évolution jour par jour">'+g+'</svg>';
}
function chartPoint(e,svg){
  if(!CG.n)return;
  var rc=svg.getBoundingClientRect(),xv=(e.clientX-rc.left)/rc.width*CG.W;
  var i=CG.n>1?Math.round((xv-CG.L)/((CG.W-CG.L-CG.R)/(CG.n-1))):0;
  i=Math.max(0,Math.min(CG.n-1,i));
  var d=CG.days[i],m=$('#cm');
  if(m){
    var xx=CG.n>1?CG.L+i*(CG.W-CG.L-CG.R)/(CG.n-1):CG.W/2;
    m.setAttribute('x1',xx);m.setAttribute('x2',xx);m.setAttribute('visibility','visible');
  }
  $('#cp').innerHTML='<b>'+dlab(d.t)+'</b> : ventes '+showU(d.v)+', dépenses '+showU(d.d)+', bénéfice net '+showU(d.n);
}
function sumSales(a,b){return S.sales.reduce(function(t,x){return (x.t>=a&&x.t<b)?t+x.total:t;},0);}
function prodHtml(r){
  var cur={},prev={};
  function slot(m,id,name){return m[id]||(m[id]={name:name,q:0,c:0,p:0});}
  S.products.forEach(function(p){slot(cur,p.id,p.name);});
  var e1=r.s+r.len*864e5,e0=r.ps+r.len*864e5;
  S.sales.forEach(function(x){
    var m=(x.t>=r.s&&x.t<e1)?cur:(x.t>=r.ps&&x.t<e0)?prev:null;
    if(!m)return;
    x.lines.forEach(function(l){var o=slot(m,l.id,l.name);o.q+=l.q;o.c+=l.u*l.q;o.p+=(l.u-(l.c||0))*l.q;});
  });
  function val(o){return emetric==='q'?o.q:emetric==='c'?o.c:o.p;}
  var rows=Object.keys(cur).map(function(id){var o=cur[id];return {name:o.name,q:o.q,c:o.c,p:o.p,v:val(o),pv:prev[id]?val(prev[id]):0};});
  var sold=rows.filter(function(x){return x.q>0;}).sort(function(a,b){return b.v-a.v;});
  var none=rows.filter(function(x){return x.q<=0;});
  var h='<div class="row head"><h2>Produits</h2></div><div class="chips">'+
    [['q','Quantité'],['c','Chiffre d’affaires'],['p','Bénéfice']].map(function(a){
      return '<button class="chip'+(emetric===a[0]?' on':'')+'" data-act="emetric" data-k="'+a[0]+'">'+a[1]+'</button>';
    }).join('')+'</div>';
  if(!rows.length)return h+'<p class="muted pad">Ajoute des produits pour voir leur performance.</p>';
  h+='<p class="muted">'+(sold.length?'Le meilleur : <b>'+esc(sold[0].name)+'</b>. ':'Aucune vente sur cette période. ')+
    (none.length?none.length+' produit'+(none.length>1?'s':'')+' sans vente.':'Tous tes produits ont été vendus.')+'</p>';
  var best=sold.length?sold[0].v:0;
  function fv(v){return emetric==='q'?v+' vendu'+(v>1?'s':''):showU(v);}
  h+='<ul class="pl">'+sold.map(function(x){
    var ratio=best>0?x.v/best:0,cls=ratio>=0.5?'top':ratio>=0.2?'mid':'low';
    var lab=cls==='top'?'Fort':cls==='mid'?'Moyen':'Faible';
    var tr=trendTxt(x.v,x.pv);
    return '<li class="pr b-'+cls+'"><div class="pn"><div><b>'+esc(x.name)+'</b><span class="tag t-'+cls+'">'+lab+'</span></div><span>'+fv(x.v)+'</span></div>'+
      '<div class="bar"><i style="width:'+Math.max(3,Math.round(Math.max(0,ratio)*100))+'%"></i></div>'+
      '<small>'+x.q+' vendu'+(x.q>1?'s':'')+', ventes '+showU(x.c)+', bénéfice '+showU(x.p)+'</small>'+
      (tr.t?'<small class="'+tr.c+'">'+tr.t+'</small>':'')+'</li>';
  }).join('')+none.map(function(x){
    return '<li class="pr"><div class="pn"><div><b>'+esc(x.name)+'</b><span class="tag t-zero">Aucune vente</span></div></div></li>';
  }).join('')+'</ul>';
  var tq=0,tc=0,tpp=0;rows.forEach(function(x){tq+=x.q;tc+=x.c;tpp+=x.p;});
  h+='<div class="gt"><div><span>Articles vendus</span><strong>'+tq+'</strong></div><div><span>Chiffre d’affaires</span><strong>'+showU(tc)+'</strong></div><div><span>Bénéfice sur les ventes</span><strong>'+showU(tpp)+'</strong></div></div>';
  return h;
}
function viewEvo(){
  var r=range(),days=daily(r);
  var tv=0,tp=0,td=0;days.forEach(function(d){tv+=d.v;tp+=d.p;td+=d.d;});
  var net=tp-td,cost=tv-tp,nq=0,ns=0,e1=r.s+r.len*864e5;
  S.sales.forEach(function(x){if(x.t>=r.s&&x.t<e1){ns++;x.lines.forEach(function(l){nq+=l.q;});}});
  var pt=sumSales(r.ps,r.ps+r.len*864e5),tr=trendTxt(tv,pt);
  var h=segV()+'<div class="row head"><h2>Évolution</h2></div><div class="chips">'+
    [['7','7 jours'],['30','30 jours'],['month','Ce mois']].map(function(a){
      return '<button class="chip'+(erange===a[0]?' on':'')+'" data-act="erange" data-k="'+a[0]+'">'+a[1]+'</button>';
    }).join('')+'</div>'+
    '<div class="sum"><div><span class="lab">Chiffre d’affaires</span><strong>'+showU(tv)+'</strong><small>'+otherU(tv)+'</small></div>'+
    '<div class="cnt"><span class="lab">Bénéfice net</span><strong>'+showU(net)+'</strong><small>après dépenses</small></div></div>'+
    '<ul class="methods"><li><span>Chiffre d’affaires (somme des ventes)</span><b>'+showU(tv)+'</b></li>'+
    '<li><span>Coût d’achat des produits vendus</span><b>'+showU(cost)+'</b></li>'+
    '<li><span>Bénéfice sur les ventes</span><b>'+showU(tp)+'</b></li>'+
    '<li><span>Dépenses</span><b>'+showU(td)+'</b></li>'+
    '<li class="net"><span>Bénéfice net</span><b>'+showU(net)+'</b></li>'+
    '<li><span>Articles vendus</span><b>'+nq+' en '+ns+' vente'+(ns>1?'s':'')+'</b></li></ul>';
  if(tr.t)h+='<p class="muted"><span class="'+tr.c+'"><b>'+tr.t.replace(' par rapport à la période d’avant','')+'</b></span> par rapport à la période d’avant (ventes)</p>';
  if(!S.sales.length){
    h+='<p class="muted pad">Pas encore de ventes. Les courbes apparaissent dès la première vente enregistrée.</p>'+prodHtml(r);
    $('#view').innerHTML=h;return;
  }
  h+='<div class="chips">'+[['v','Ventes'],['d','Dépenses'],['n','Bénéfice net']].map(function(a){
    return '<button class="chip lg'+(eser[a[0]]?' on':'')+'" data-act="ser" data-k="'+a[0]+'"><span class="dot d-'+a[0]+'"></span>'+a[1]+'</button>';
  }).join('')+'</div>'+lineChart(days);
  var bi=-1,bv=0;days.forEach(function(d,i){if(d.v>bv){bv=d.v;bi=i;}});
  h+='<p class="muted" id="cp">'+(bi>=0?'Meilleur jour : <b>'+dlab(days[bi].t)+'</b> avec '+showU(bv)+'. Touche la courbe pour voir un autre jour.':'Aucune vente sur cette période.')+'</p>';
  h+=prodHtml(r);
  $('#view').innerHTML=h;
}

/* Rendu */
function render(){
  document.querySelectorAll('.nav button').forEach(function(b){b.classList.toggle('on',b.dataset.tab===tab);});
  updateHeader();
  ({caisse:viewCaisse,stock:viewStock,sales:viewSales,money:viewMoney,set:viewSet})[tab]();
  updateBar();
}

/* Actions */
document.addEventListener('click',function(e){
  if(e.target.id==='ov'){closeSheet();return;}
  var t=e.target.closest('[data-act],[data-tab]');
  if(!t)return;
  if(t.dataset.tab){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  var a=t.dataset.act,id=t.dataset.id;
  switch(a){
    case 'close':closeSheet();break;
    case 'goset':tab='set';render();window.scrollTo(0,0);break;
    case 'cur':S.cur=S.cur==='USD'?'CDF':'USD';save();render();if(sheetKind==='cart')openCart();break;
    case 'add':add(id,1);break;
    case 'inc':add(id,1);break;
    case 'dec':add(id,-1);break;
    case 'cart':openCart();break;
    case 'pay':payM=t.dataset.m;openCart();break;
    case 'clear':cart={};closeSheet();updateCaisse();break;
    case 'checkout':checkout();break;
    case 'newp':openProduct(null);break;
    case 'editp':openProduct(id);break;
    case 'savep':saveProduct(id);break;
    case 'delp':
      if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Touche encore pour confirmer';break;}
      S.products=S.products.filter(function(p){return p.id!==id;});delete cart[id];
      save();closeSheet();render();toast('Produit supprimé');break;
    case 'demo':demo();break;
    case 'period':period=t.dataset.k;render();break;
    case 'sale':openSale(id);break;
    case 'cancelsale':
      if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Touche encore pour confirmer';break;}
      var s=S.sales.find(function(x){return x.id===id;});
      if(s){s.lines.forEach(function(l){var p=pById(l.id);if(p)p.stock+=l.q;});}
      S.sales=S.sales.filter(function(x){return x.id!==id;});S.debts=S.debts.filter(function(d){return d.saleId!==id;});
      save();closeSheet();render();toast('Vente annulée, stock remis');break;
    case 'msale':openMSale();break;
    case 'ml_add':M.lines.push({id:'',q:'1',price:''});drawMSale();break;
    case 'ml_del':M.lines.splice(+t.dataset.i,1);drawMSale();break;
    case 'm_pay':M.pay=t.dataset.m;drawMSale();break;
    case 'm_save':saveMSale();break;
    case 'msub':msub=t.dataset.k;render();break;
    case 'newexp':openExp();break;
    case 'saveexp':saveExp();break;
    case 'exp':openExpDetail(id);break;
    case 'delexp':
      if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Touche encore pour confirmer';break;}
      S.expenses=S.expenses.filter(function(x){return x.id!==id;});save();closeSheet();render();toast('Dépense supprimée');break;
    case 'newdebt':openNewDebt();break;
    case 'dk':dkind=t.dataset.k;$('#dk_client').classList.toggle('on',dkind==='client');$('#dk_fournisseur').classList.toggle('on',dkind==='fournisseur');break;
    case 'savedebt':saveDebt();break;
    case 'debt':openDebt(id);break;
    case 'paydebt':payDebt(id,false);break;
    case 'payall':payDebt(id,true);break;
    case 'deldebt':
      if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Touche encore pour confirmer';break;}
      S.debts=S.debts.filter(function(x){return x.id!==id;});save();closeSheet();render();toast('Dette supprimée');break;
    case 'vsub':vsub=t.dataset.k;render();break;
    case 'erange':erange=t.dataset.k;render();break;
    case 'emetric':emetric=t.dataset.k;render();break;
    case 'ser':eser[t.dataset.k]=!eser[t.dataset.k];render();break;
    case 'chartpt':chartPoint(e,t);break;
    case 'setcur':S.cur=t.dataset.c;save();render();break;
    case 'saveset':
      var r=num($('#s_rate').value);
      if(r<=0){toast('Indique un taux supérieur à zéro');break;}
      S.shop=$('#s_shop').value.trim()||'Mon commerce';S.rate=r;save();render();toast('Réglages enregistrés');break;
    case 'login':authSubmit('login');break;
    case 'signup':authSubmit('signup');break;
    case 'clpush':pushCloud(false,false);break;
    case 'clpull':pullCloud(false);break;
    case 'logout':
      if(CL.dirty&&A){pushCloud(true,false).then(doLogout);}else doLogout();
      break;
    case 'dlbk':doBackup();break;
    case 'importbk':$('#bkfile').click();break;
    case 'install':
      if(deferredPrompt){deferredPrompt.prompt();deferredPrompt.userChoice.then(function(){deferredPrompt=null;instUI();});}
      break;
    case 'copybk':
      var ta=$('#bk');ta.value=JSON.stringify(S);ta.select();
      try{
        navigator.clipboard.writeText(ta.value).then(function(){markBk();toast('Sauvegarde copiée');},function(){toast('Texte sélectionné : copie-le avec le menu du téléphone');});
      }catch(err){toast('Texte sélectionné : copie-le avec le menu du téléphone');}
      break;
    case 'restorebk':
      try{
        var o=JSON.parse($('#bk').value);
        if(!o||!Array.isArray(o.products)||!Array.isArray(o.sales))throw new Error('format');
        S=norm(o);cart={};save();render();toast('Données restaurées');
      }catch(err){toast('Ce texte n’est pas une sauvegarde valide');}
      break;
    case 'wipe':
      if(t.dataset.sure!=='1'){t.dataset.sure='1';t.textContent='Touche encore pour tout effacer';break;}
      S=JSON.parse(JSON.stringify(DEF));cart={};save();render();toast('Données effacées');break;
  }
});
document.addEventListener('input',onMInput);document.addEventListener('change',onMInput);
$('#bkfile').addEventListener('change',function(e){importFile(e.target.files&&e.target.files[0]);e.target.value='';});
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&sheetKind)closeSheet();});

render();
})();
</script>
